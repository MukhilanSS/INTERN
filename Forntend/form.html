<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">  
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Book Management</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="form.html">Insert Book</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="books.html">List Books</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="signin.html">Sign In</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="form-container">
        <!-- maximum width of form container , auto margin(left,right) , padding , color ,  rounder corners(large radius)-->
        <h1 class="form-title">Form Validation</h1><!--font size 1.5rem, bold, center, margin bottom 1 rem(16px)-->
        <span id="e0" class="error"></span>
        <form class="form-grid" id="form1" onsubmit="return validateForm()">
            <!--grid,creates 1 column(defaut mobiles),Medium size screen and larger ku 2, sapce between grid 4-->
            <div class="form-group">
                <label for="bookName">Book Name : </label><!-- block kila mela semi bold-->
                <input type="text" id="bookName" name="bookName" placeholder="Enter book name" tabindex="1">
                <span id="e1" class="error"></span>

            </div>

            <div class="form-group">
                <label for="authorName">Author Name : </label>
                <input type="text" id="authorName" name="authorName" placeholder="Enter author name" tabindex="2">
                <span id="e2" class="error"></span>

            </div>

            <div class="form-group">
                <label for="authorMail">Author Mail: </label>
                <input type="text" id="authorMail" name="authorMail" placeholder="Enter author mail" tabindex="3">
                <span id="e3" class="error"></span>

            </div>

            <div class="form-group">
                <label for="publisher">Publisher : </label>
                <input type="text" name="publisher" id="publisher" placeholder="Enter publisher " tabindex="4">
                <span id="e4" class="error"></span>

            </div>

            <div class="form-group full-width">
                <label for="description">Description : </label>
                <textarea name="description" id="description" placeholder="Enter the book description" tabindex="5"
                    rows="3"></textarea>
                <span id="e5" class="error"></span>

            </div>

            <div class="form-group">
                <label for="price">Price : </label>
                <input type="number" name="price" id="price" placeholder="Enter the book price" tabindex="6">
                <span id="e6" class="error"></span>

            </div>

            <div class="form-group full-width text-center">
                <button type="submit" id="submit-btn">Submit</button>
            </div>

        </form>
    </div>
    <script src="script.js"></script>
    <script src="connect.js"></script>
    <script src="api.js"></script>
    <script src="validation.js"></script>
    <script src="bookdata.js"></script>
</body>

</html>
